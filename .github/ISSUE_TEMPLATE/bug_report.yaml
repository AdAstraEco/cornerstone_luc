name: 🐞 Bug report
description: Report something that isn't working
title: "[BUG] <title>"
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    attributes:
      label: Current behavior
      description: A concise description of what you're experiencing.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. On this tile / country / commodity...
        2. With this config...
        3. Run '...'
        4. See error...
    validations:
      required: false
  - type: textarea
    attributes:
      label: Environment
      description: Where it happened.
      value: |
        - Commit / release:
        - Run location (local, cluster, …):
        - Python:
    validations:
      required: false
  - type: textarea
    attributes:
      label: Done when — must have
      description: The criteria that must all be met before this issue can be closed.
      value: |
        - [ ] Bug no longer reproduces with the steps above
        - [ ] Regression test added
    validations:
      required: true
  - type: textarea
    attributes:
      label: Done when — nice to have
      description: Welcome but not blocking; can be split into a follow-up issue.
      value: |
        - [ ] 
    validations:
      required: false
  - type: textarea
    attributes:
      label: External dependencies
      description: |
        Anything outside the team this depends on (upstream dataset fix, library release, …).
        If any, add the `external-dependency` label.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Logs?

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
