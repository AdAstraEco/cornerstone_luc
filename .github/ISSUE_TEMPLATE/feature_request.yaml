name: ✨ Feature / improvement
description: Propose new work. Raise this before opening a PR.
title: "[Feature] <title>"
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for this work.
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    attributes:
      label: Context
      description: What problem does this solve, and why now? Link the source (Miro sticky, decisions doc, meeting notes, …).
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed change
      description: What you intend to do. Can stay rough at this stage.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Done when — must have
      description: The criteria that must all be met before this issue can be closed.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    attributes:
      label: Done when — nice to have
      description: Welcome but not blocking; can be split into a follow-up issue.
      value: |
        - [ ] 
    validations:
      required: false
  - type: textarea
    attributes:
      label: External dependencies
      description: |
        Anything outside the team this depends on (data provider, another team, a decision, …).
        If any, add the `external-dependency` label.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Alternatives considered?

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
