# SPIKE (docs/spike-dask-k8s.md): ONE k8s Job == ONE tile (approach B).
#
# This is a TEMPLATE, not a ready manifest. spike/run-tiles.py renders it once per tile,
# substituting the per-tile placeholders (JOB_NAME / STAGE / TILE_ID) and the infra
# placeholders (NAMESPACE / SERVICE_ACCOUNT / NODE_POOL / SECRET_NAME / IMAGE) it reads from
# spike/infra.env, then applies each to the target namespace. There is NO dask scheduler and
# NO change to jdluc: the pod runs the real stage (spike/run_tile.py), whose cache_to_zarr
# writes straight to GCS. Node-pool autoscaling is the scaling knob -- submit N jobs, the
# cluster runs as many as it fits.
#
# DO NOT apply this file by hand (the placeholders are unrendered). Drive it via
# spike/run-tiles.py; see spike/k8s/README.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels: {app: jdluc-tile, stage: "${STAGE}"}
spec:
  backoffLimit: 1               # one retry; a persistent failure is a finding, not noise
  ttlSecondsAfterFinished: 3600 # let finished jobs (and their pods) clean themselves up
  template:
    metadata:
      labels: {app: jdluc-tile, stage: "${STAGE}"}
    spec:
      restartPolicy: Never
      # Workload-Identity-bound KSA -> GCS. Same KSA the celery workers use; no new IAM.
      serviceAccountName: ${SERVICE_ACCOUNT}
      # Memory-heavy tiles -> the highmem pool (e2-highmem-8: 8 vCPU / 64 GiB), which
      # autoscales 0->N as these Job pods schedule.
      nodeSelector:
        cloud.google.com/gke-nodepool: ${NODE_POOL}
      containers:
        - name: tile
          image: ${IMAGE}
          # Run the whole stage for this one tile. The stage spins its own in-process
          # LocalCluster (jdluc.storage, sized by NUMBER_OF_DASK_WORKERS) for the
          # per-tile threaded compute -- so one pod == one laptop run of one tile.
          command: ["python", "spike/run_tile.py", "--stage", "${STAGE}", "${TILE_ID}"]
          resources:
            # ~one tile per e2-highmem-8 node, leaving headroom for system pods.
            requests: {cpu: "6", memory: "48Gi"}
            limits: {cpu: "8", memory: "60Gi"}
          volumeMounts:
            # Config.from_dot_env reads a FILE, so mount the .env Secret at /app/.env.
            - {name: dotenv, mountPath: /app/.env, subPath: .env, readOnly: true}
      volumes:
        - name: dotenv
          secret: {secretName: ${SECRET_NAME}}
